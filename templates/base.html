<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Invest Dashboard{% endblock %}</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <nav class="tabs">
    {% if current_user %}
    <a href="{{ url_for('price.index') }}" class="tab tab--price {{ 'active' if active_tab == 'price' else '' }}">Price Chart (150-day SMA)</a>
    <a href="{{ url_for('financials.index') }}" class="tab tab--financials {{ 'active' if active_tab == 'financials' else '' }}">Financials</a>
    <a href="{{ url_for('status.index') }}" class="tab tab--status {{ 'active' if active_tab == 'status' else '' }}">Portfolio</a>
    <a href="{{ url_for('events.index') }}" class="tab tab--events {{ 'active' if active_tab == 'events' else '' }}">Events</a>
    <a href="{{ url_for('news.index') }}" class="tab tab--news {{ 'active' if active_tab == 'news' else '' }}">News</a>
    <span class="nav-user">
      <a href="{{ url_for('help_page') }}" class="nav-help {{ 'active' if active_tab == 'help' else '' }}" title="Help" aria-label="Help">?</a>
      <span class="nav-email" title="Signed in as {{ current_user.email }}">{{ current_user.email }}</span>
      <form method="post" action="{{ url_for('auth.logout') }}">
        <button type="submit" class="nav-logout">Sign out</button>
      </form>
    </span>
    {% endif %}
  </nav>
  <div class="page">
    {% block content %}{% endblock %}
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
