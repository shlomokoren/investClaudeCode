# Holds the app's secrets: Neon connection string, session signing key, and the
# Google OAuth client credentials.
# Do NOT commit the real values — either fill them in out-of-band, or create the
# secret imperatively instead of applying this file:
#
#   kubectl -n invest-app create secret generic invest-app-db \
#     --from-literal=DATABASE_URL='postgresql://USER:PASSWORD@HOST.neon.tech/neondb?sslmode=require&channel_binding=require' \
#     --from-literal=SECRET_KEY="$(python -c 'import secrets; print(secrets.token_hex(32))')" \
#     --from-literal=GOOGLE_CLIENT_ID='...apps.googleusercontent.com' \
#     --from-literal=GOOGLE_CLIENT_SECRET='...'
apiVersion: v1
kind: Secret
metadata:
  name: invest-app-db
  labels:
    app: invest-app
type: Opaque
stringData:
  DATABASE_URL: "postgresql://USER:PASSWORD@HOST.neon.tech/neondb?sslmode=require&channel_binding=require"
  # Signs session cookies; changing it signs everyone out.
  SECRET_KEY: "REPLACE_WITH_RANDOM_64_HEX_CHARS"
  GOOGLE_CLIENT_ID: "REPLACE.apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "REPLACE"
